name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v1.2.4'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            rid: win-x64
          - name: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
          - name: Linux ARM64
            os: ubuntu-22.04
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-6 libice6 libsm6 libfontconfig1

      - name: Publish CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet publish src/PatchDiff.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:InformationalVersion=$env:version -p:IncludeSourceRevisionInInformationalVersion=false -o "publish\win-x64\cli"

      - name: Publish CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          dotnet publish src/PatchDiff.Cli -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:InformationalVersion=${{ env.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o "publish/${{ matrix.rid }}/cli"

      - name: Publish App (Avalonia, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet publish src/PatchDiff.AppA -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:InformationalVersion=$env:version -p:IncludeSourceRevisionInInformationalVersion=false -o "publish\win-x64\app"

      - name: Publish App (Avalonia, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          dotnet publish src/PatchDiff.AppA -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:InformationalVersion=${{ env.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o "publish/${{ matrix.rid }}/app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "publish/win-x64/cli/*" -DestinationPath "dist/patchdiff-win-x64.zip" -Force
          Compress-Archive -Path "publish/win-x64/app/*" -DestinationPath "dist/PatchDiff-win-x64.zip" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DAppVersion=$env:version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows release files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

      - name: Upload compiled Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error

  appimage:
    name: Build AppImage ${{ matrix.rid }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            appimage_arch: x86_64
          - rid: linux-arm64
            appimage_arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Download compiled build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

      - name: Install AppImage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          curl --fail --location --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Create AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/lib/patchdiff AppDir/usr/share/applications
          cp -a "publish/${{ matrix.rid }}/app/." AppDir/usr/lib/patchdiff/
          cp src/PatchDiff.AppA/Assets/icon-512.png AppDir/patchdiff.png
          cat > AppDir/patchdiff.desktop <<'EOF'
          [Desktop Entry]
          Name=PatchDiff
          Comment=Watch game DLLs and see what a patch changed
          Exec=patchdiff
          Icon=patchdiff
          Type=Application
          Categories=Development;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/patchdiff.desktop
          cp AppDir/patchdiff.desktop AppDir/usr/share/applications/patchdiff.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/usr/lib/patchdiff/PatchDiff" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/lib/patchdiff/PatchDiff
          export ARCH=${{ matrix.appimage_arch }}
          ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "PatchDiff-${{ matrix.rid }}.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.rid }}
          path: "PatchDiff-${{ matrix.rid }}.AppImage"
          if-no-files-found: error

  package:
    name: Package release archives
    needs: [build, appimage]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-linux-*
          path: builds
          merge-multiple: false

      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: appimage-linux-*
          path: appimages
          merge-multiple: false

      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PatchDiff/linux-x64 PatchDiff/linux-arm64
          cp -a builds/build-linux-x64/app/. PatchDiff/linux-x64/
          cp builds/build-linux-x64/cli/patchdiff PatchDiff/linux-x64/patchdiff-cli
          cp -a builds/build-linux-arm64/app/. PatchDiff/linux-arm64/
          cp builds/build-linux-arm64/cli/patchdiff PatchDiff/linux-arm64/patchdiff-cli
          cp appimages/appimage-linux-x64/PatchDiff-linux-x64.AppImage PatchDiff/linux-x64/
          cp appimages/appimage-linux-arm64/PatchDiff-linux-arm64.AppImage PatchDiff/linux-arm64/
          chmod +x PatchDiff/linux-x64/* PatchDiff/linux-arm64/* 2>/dev/null || true
          (cd PatchDiff/linux-x64 && tar -czf ../../PatchDiff-linux-x64.tar.gz .)
          (cd PatchDiff/linux-arm64 && tar -czf ../../PatchDiff-linux-arm64.tar.gz .)

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            PatchDiff-linux-x64.tar.gz
            PatchDiff-linux-arm64.tar.gz

  release:
    name: Publish GitHub release
    needs: [build, appimage, package]
    runs-on: ubuntu-22.04
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives

      - name: Download x64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux-x64

      - name: Download ARM64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux-arm64

      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Publish release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: |
            PatchDiff-linux-x64.tar.gz
            PatchDiff-linux-arm64.tar.gz
            PatchDiff-linux-x64.AppImage
            PatchDiff-linux-arm64.AppImage
            dist/patchdiff-win-x64.zip
            dist/PatchDiff-win-x64.zip
            dist/PatchDiff-setup-*.exe
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: PatchDiff ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          allowUpdates: true
