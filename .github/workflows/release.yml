name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish CLI (self-contained single file)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/PatchDiff.Cli -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:InformationalVersion=$ver -p:IncludeSourceRevisionInInformationalVersion=false `
            -o dist/cli

      - name: Publish App (Avalonia, self-contained single file)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/PatchDiff.AppA -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:InformationalVersion=$ver -p:IncludeSourceRevisionInInformationalVersion=false `
            -o dist/app

      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/cli/*" -DestinationPath "patchdiff-win-x64.zip" -Force
          Compress-Archive -Path "dist/app/*" -DestinationPath "PatchDiff-win-x64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & $iscc installer.iss /DAppVersion=$ver
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            patchdiff-win-x64.zip
            PatchDiff-win-x64.zip
            dist/PatchDiff-setup-*.exe

  linux:
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            rid: linux-x64
            deploy: linuxdeploy-x86_64.AppImage
            tar: patchdiff-linux-x64.tar.gz
            appimage: patchdiff-linux-x64.AppImage
          - arch: arm64
            rid: linux-arm64
            deploy: linuxdeploy-aarch64.AppImage
            tar: patchdiff-linux-arm64.tar.gz
            appimage: patchdiff-linux-arm64.AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish App (Avalonia, self-contained single file)
        run: |
          VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          dotnet publish src/PatchDiff.AppA -c Release -r ${{ matrix.rid }}             --self-contained true             -p:PublishSingleFile=true -p:PublishTrimmed=false             -p:InformationalVersion=$VER -p:IncludeSourceRevisionInInformationalVersion=false             -o dist/app-linux

      - name: Package .tar.gz
        run: |
          mkdir -p release/patchdiff-${{ github.ref_name }}-${{ matrix.arch }}
          cp -a dist/app-linux/* release/patchdiff-${{ github.ref_name }}-${{ matrix.arch }}/
          tar -czf ${{ matrix.tar }} -C release patchdiff-${{ github.ref_name }}-${{ matrix.arch }}

      - name: Package .AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp -a dist/app-linux/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/PatchDiff
          cat > AppDir/usr/share/applications/patchdiff.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=PatchDiff
          Exec=PatchDiff
          Icon=patchdiff
          Type=Application
          Categories=Development;
          Comment=Watch game DLLs and see what a patch changed
          DESKTOP
          # icon: AppImage wants usr/share/icons/hicolor/<size>/apps/<name>.png
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          cp src/PatchDiff.AppA/Assets/icon-512.png AppDir/usr/share/icons/hicolor/512x512/apps/patchdiff.png
          ln -sf usr/share/icons/hicolor/512x512/apps/patchdiff.png AppDir/.DirIcon
          ln -sf usr/bin/PatchDiff AppDir/AppRun
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/${{ matrix.deploy }}"
          chmod +x ${{ matrix.deploy }}
          OUTPUT=${{ matrix.appimage }} ./${{ matrix.deploy }} --appdir AppDir --output appimage
          chmod +x ${{ matrix.appimage }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            ${{ matrix.tar }}
            ${{ matrix.appimage }}
