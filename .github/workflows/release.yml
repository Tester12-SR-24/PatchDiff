name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish, for example v2.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            rid: win-x64
          - name: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
            arch: x64
          - name: Linux ARM64
            os: ubuntu-22.04
            rid: linux-arm64
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-6 libice6 libsm6 libfontconfig1 xvfb

      # PatchDiff ships two executables per platform: the Avalonia GUI (PatchDiff)
      # and the headless CLI (patchdiff). Both are stamped from the release tag so
      # `--version` output always matches the published release.
      - name: Publish CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          dotnet publish src/PatchDiff.Cli -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o "publish\win-x64\cli"

      - name: Publish CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish src/PatchDiff.Cli -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 \
            -p:FileVersion=${{ steps.version.outputs.version }}.0 \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -o "publish/${{ matrix.rid }}/cli"

      - name: Publish Avalonia app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          dotnet publish src/PatchDiff.AppA -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o "publish\win-x64\app"

      - name: Publish Avalonia app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish src/PatchDiff.AppA -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 \
            -p:FileVersion=${{ steps.version.outputs.version }}.0 \
            -p:InformationalVersion=${{ steps.version.outputs.version }} \
            -p:IncludeSourceRevisionInInformationalVersion=false \
            -o "publish/${{ matrix.rid }}/app"
          chmod +x "publish/${{ matrix.rid }}/app/PatchDiff" "publish/${{ matrix.rid }}/cli/patchdiff"

      - name: Windows launch smoke test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "patchdiff-smoke-$PID"
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          $env:PATCHDIFF_DATA_DIR = Join-Path $smokeDir "data"
          $stdout = Join-Path $smokeDir "stdout.log"
          $stderr = Join-Path $smokeDir "stderr.log"
          $process = Start-Process -FilePath (Resolve-Path "publish/win-x64/app/PatchDiff.exe") -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            # A cold single-file launch extracts native libraries on first run, so the
            # window can take well over 10s to appear. Poll instead of checking once.
            $deadline = (Get-Date).AddSeconds(90)
            $handle = 0
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { break }
              $process.Refresh()
              $handle = $process.MainWindowHandle
              if ($handle -ne 0) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($process.HasExited) {
              if (Test-Path $stderr) { Get-Content $stderr }
              if (Test-Path $stdout) { Get-Content $stdout }
              $crashDir = Join-Path $env:PATCHDIFF_DATA_DIR "logs"
              if (Test-Path $crashDir) { Get-ChildItem $crashDir | ForEach-Object { Get-Content $_.FullName } }
              throw "PatchDiff exited during Windows startup with code $($process.ExitCode)"
            }
            if ($handle -eq 0) {
              if (Test-Path $stderr) { Get-Content $stderr }
              if (Test-Path $stdout) { Get-Content $stdout }
              $crashDir = Join-Path $env:PATCHDIFF_DATA_DIR "logs"
              if (Test-Path $crashDir) { Get-ChildItem $crashDir | ForEach-Object { Get-Content $_.FullName } }
              throw "PatchDiff remained alive for 90s but never created a main window."
            }
            Write-Host "PatchDiff created main window '$($process.MainWindowTitle)' and remained alive (PID $($process.Id))."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Linux x64 launch smoke test
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set +e
          timeout 12s xvfb-run -a "$(pwd)/publish/linux-x64/app/PatchDiff" > /tmp/patchdiff-smoke.log 2>&1
          code=$?
          cat /tmp/patchdiff-smoke.log
          if [ "$code" -ne 124 ]; then
            echo "Avalonia app did not remain running through the smoke-test timeout (exit code $code)" >&2
            exit 1
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Get-ChildItem -Path "publish/win-x64/cli", "publish/win-x64/app" -Filter "*.pdb" -File -Recurse | Remove-Item -Force
          Compress-Archive -Path "publish/win-x64/cli/*" -DestinationPath "dist/patchdiff-win-x64.zip" -Force
          Compress-Archive -Path "publish/win-x64/app/*" -DestinationPath "dist/PatchDiff-app-win-x64.zip" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DAppVersion=${{ steps.version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows release files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

      - name: Package Linux build with executable modes preserved
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "build-${{ matrix.arch }}.tar.gz" -C "publish/${{ matrix.rid }}" .
          tar -tvzf "build-${{ matrix.arch }}.tar.gz" | grep -E 'PatchDiff$|patchdiff$'

      - name: Upload Linux build archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.rid }}
          path: build-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  appimage:
    name: Build AppImage ${{ matrix.rid }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: x64
            appimage_arch: x86_64
          - rid: linux-arm64
            arch: arm64
            appimage_arch: aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Download build archive
        uses: actions/download-artifact@v5
        with:
          name: build-${{ matrix.rid }}
          path: build-archive

      - name: Extract build archive
        shell: bash
        run: |
          mkdir -p "publish/${{ matrix.rid }}"
          tar -xzf build-archive/build-${{ matrix.arch }}.tar.gz -C "publish/${{ matrix.rid }}"
          chmod +x "publish/${{ matrix.rid }}/app/PatchDiff" "publish/${{ matrix.rid }}/cli/patchdiff"

      - name: Install AppImage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          # appimagetool runs on the x86-64 CI host; ARCH selects the target runtime.
          curl --fail --location --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Create AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/lib/patchdiff AppDir/usr/bin AppDir/usr/share/applications
          cp -a "publish/${{ matrix.rid }}/app/." AppDir/usr/lib/patchdiff/
          cat > AppDir/usr/bin/patchdiff <<'EOF'
          #!/bin/sh
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/../lib/patchdiff/PatchDiff" "$@"
          EOF
          cp src/PatchDiff.AppA/Assets/icon-512.png AppDir/patchdiff.png
          cat > AppDir/patchdiff.desktop <<'EOF'
          [Desktop Entry]
          Name=PatchDiff
          Comment=Watch game DLLs and see what a patch changed
          Exec=patchdiff
          Icon=patchdiff
          Type=Application
          Categories=Development;
          Terminal=false
          EOF
          sed -i 's/^[[:space:]]*//' AppDir/patchdiff.desktop
          cp AppDir/patchdiff.desktop AppDir/usr/share/applications/patchdiff.desktop
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$HERE/usr/lib/patchdiff/PatchDiff" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/patchdiff AppDir/usr/lib/patchdiff/PatchDiff
          export ARCH=${{ matrix.appimage_arch }}
          ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "PatchDiff-${{ matrix.rid }}.AppImage"
          chmod +x "PatchDiff-${{ matrix.rid }}.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: appimage-${{ matrix.rid }}
          path: "PatchDiff-${{ matrix.rid }}.AppImage"
          if-no-files-found: error

  package:
    name: Package release archives
    needs: [build, appimage]
    runs-on: ubuntu-22.04
    steps:
      - name: Download x64 build
        uses: actions/download-artifact@v5
        with:
          name: build-linux-x64
          path: input/build-linux-x64

      - name: Download ARM64 build
        uses: actions/download-artifact@v5
        with:
          name: build-linux-arm64
          path: input/build-linux-arm64

      - name: Download x64 AppImage
        uses: actions/download-artifact@v5
        with:
          name: appimage-linux-x64
          path: input/appimage-linux-x64

      - name: Download ARM64 AppImage
        uses: actions/download-artifact@v5
        with:
          name: appimage-linux-arm64
          path: input/appimage-linux-arm64

      # Archives follow the README layout: PatchDiff + patchdiff-cli + the AppImage
      # at the archive root, so "extract and run" works without nesting.
      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/extracted-x64 input/extracted-arm64 PatchDiff/linux-x64 PatchDiff/linux-arm64
          tar -xzf input/build-linux-x64/build-x64.tar.gz -C input/extracted-x64
          tar -xzf input/build-linux-arm64/build-arm64.tar.gz -C input/extracted-arm64
          cp -a input/extracted-x64/app/. PatchDiff/linux-x64/
          cp input/extracted-x64/cli/patchdiff PatchDiff/linux-x64/patchdiff-cli
          cp -a input/extracted-arm64/app/. PatchDiff/linux-arm64/
          cp input/extracted-arm64/cli/patchdiff PatchDiff/linux-arm64/patchdiff-cli
          cp input/appimage-linux-x64/PatchDiff-linux-x64.AppImage PatchDiff/linux-x64/
          cp input/appimage-linux-arm64/PatchDiff-linux-arm64.AppImage PatchDiff/linux-arm64/
          chmod +x PatchDiff/linux-x64/PatchDiff PatchDiff/linux-x64/patchdiff-cli \
                   PatchDiff/linux-x64/PatchDiff-linux-x64.AppImage \
                   PatchDiff/linux-arm64/PatchDiff PatchDiff/linux-arm64/patchdiff-cli \
                   PatchDiff/linux-arm64/PatchDiff-linux-arm64.AppImage
          (cd PatchDiff/linux-x64 && tar -czf ../../PatchDiff-linux-x64.tar.gz .)
          (cd PatchDiff/linux-arm64 && tar -czf ../../PatchDiff-linux-arm64.tar.gz .)
          tar -tvzf PatchDiff-linux-x64.tar.gz | grep 'PatchDiff$'
          tar -tvzf PatchDiff-linux-x64.tar.gz | grep 'patchdiff-cli$'
          tar -tvzf PatchDiff-linux-arm64.tar.gz | grep 'PatchDiff$'
          tar -tvzf PatchDiff-linux-arm64.tar.gz | grep 'patchdiff-cli$'

      - name: Upload release archives
        uses: actions/upload-artifact@v5
        with:
          name: release-archives
          path: |
            PatchDiff-linux-x64.tar.gz
            PatchDiff-linux-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, appimage, package]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          name: release-archives
          path: release-assets

      - name: Download x64 AppImage
        uses: actions/download-artifact@v5
        with:
          name: appimage-linux-x64
          path: release-assets

      - name: Download ARM64 AppImage
        uses: actions/download-artifact@v5
        with:
          name: appimage-linux-arm64
          path: release-assets

      - name: Download Windows release files
        uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: release-assets

      # Draft-first: the release exists as a draft until every asset is verified
      # and uploaded, so a mid-run failure never leaves a published-but-empty
      # release. The tag is force-updated by ncipollo when re-published.
      - name: Publish release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: PatchDiff ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          generateReleaseNotes: true
          prerelease: false
          makeLatest: false
          allowUpdates: true
          draft: true

      - name: Upload release assets (replace existing files)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            PatchDiff-linux-x64.tar.gz \
            PatchDiff-linux-arm64.tar.gz \
            PatchDiff-linux-x64.AppImage \
            PatchDiff-linux-arm64.AppImage \
            patchdiff-win-x64.zip \
            PatchDiff-app-win-x64.zip \
            PatchDiff-setup-${RELEASE_TAG#v}.exe; do
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          mapfile -t expected_assets < <(for file in release-assets/*; do basename "$file"; done)
          while IFS= read -r asset; do
            if ! printf '%s\n' "${expected_assets[@]}" | grep -Fxq -- "$asset"; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          gh release edit "$RELEASE_TAG" --draft=false --latest
