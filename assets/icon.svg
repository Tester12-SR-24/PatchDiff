<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e38"/>
      <stop offset="1" stop-color="#17181d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#454956" stroke-width="2"/>

  <!-- left (previous) panel -->
  <rect x="22" y="30" width="40" height="68" rx="8" fill="#3a2126"/>
  <rect x="22" y="30" width="40" height="68" rx="8" fill="none" stroke="#a04552" stroke-width="2"/>
  <g stroke="#ff8fa0" stroke-width="4" stroke-linecap="round">
    <line x1="31" y1="48" x2="53" y2="48"/>
    <line x1="31" y1="64" x2="49" y2="64"/>
    <line x1="31" y1="80" x2="53" y2="80"/>
  </g>

  <!-- right (new) panel -->
  <rect x="66" y="30" width="40" height="68" rx="8" fill="#1f3a24"/>
  <rect x="66" y="30" width="40" height="68" rx="8" fill="none" stroke="#3f8a50" stroke-width="2"/>
  <g stroke="#7be495" stroke-width="4" stroke-linecap="round">
    <line x1="75" y1="48" x2="97" y2="48"/>
    <line x1="86" y1="37" x2="86" y2="59"/>
    <line x1="75" y1="80" x2="97" y2="80"/>
    <line x1="86" y1="69" x2="86" y2="91"/>
  </g>

  <!-- patch stitch between the two halves -->
  <g stroke="#5b6274" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round">
    <line x1="64" y1="24" x2="64" y2="104"/>
  </g>
</svg>
